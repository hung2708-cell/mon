<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đảo Tri Thức Lớp 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
        }

        .game-container {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
            text-align: center;
            border: 5px solid #fff;
            position: relative;
            overflow: hidden;
        }

        h1 { color: #ff6b6b; font-size: 32px; text-shadow: 2px 2px 0px #ffeaa7; }
        h2 { color: #0984e3; margin-bottom: 25px; }

        /* Nút ở Màn hình chính */
        .subject-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            font-size: 22px;
            font-weight: 900;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }
        .subject-btn:active { transform: translateY(6px); box-shadow: none; }
        .btn-toan { background: #fdcb6e; color: #d63031; }
        .btn-tuduy { background: #a29bfe; color: white; border: 3px dashed #6c5ce7; }
        .btn-tv { background: #74b9ff; color: #0984e3; }
        .btn-dovui { background: #55efc4; color: #00b894; }
        .btn-game { background: #ff7675; color: white; border: 3px dashed #fab1a0; }

        /* Giao diện Học */
        #top-bar { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 20px; background: #fff3e0; padding: 10px 20px; border-radius: 15px; }
        .stars { color: #f1c40f; font-size: 24px; }
        
        .lesson-tag { background: #ffeaa7; color: #d63031; padding: 5px 15px; border-radius: 20px; display: inline-block; font-size: 16px; margin-bottom: 15px; }
        .question { font-size: 22px; color: #2d3436; margin-bottom: 25px; line-height: 1.4; }
        
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            padding: 12px; font-size: 18px; font-weight: bold; font-family: 'Nunito', sans-serif;
            border: 3px solid #dfe6e9; border-radius: 15px; background: white;
            cursor: pointer; transition: all 0.2s;
        }
        .option-btn:hover { border-color: #74b9ff; background: #f1f8ff; transform: scale(1.05); }
        .option-btn:active { transform: scale(0.95); }

        .feedback { margin-top: 25px; font-size: 18px; display: none; padding: 15px; border-radius: 15px; animation: pop 0.3s ease-out; }
        .correct { background: #55efc4; color: #00b894; border: 3px solid #00b894; }
        .wrong { background: #fab1a0; color: #d63031; border: 3px solid #e17055; }

        .action-btn {
            margin-top: 25px; padding: 12px 30px; font-size: 20px; font-weight: bold;
            background: #a29bfe; color: white; border: none; border-radius: 20px;
            cursor: pointer; display: none; box-shadow: 0 5px 0 #6c5ce7;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        /* Giao diện Trò Chơi (Memory Game) */
        .game-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: #dfe6e9; border: none; padding: 8px 15px; border-radius: 15px; font-weight: bold; cursor: pointer; color: #2d3436; box-shadow: 0 4px 0 #b2bec3; }
        .back-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .memory-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .memory-card { 
            height: 70px; background: #74b9ff; border-radius: 15px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 35px; cursor: pointer; transition: 0.3s; color: transparent; 
            box-shadow: 0 4px 0 #0984e3;
        }
        .memory-card.flipped { background: #fff; color: #000; border: 3px solid #74b9ff; box-shadow: none; transform: rotateY(180deg); }
        .memory-card.matched { background: #55efc4; color: #000; border: 3px solid #00b894; box-shadow: none; cursor: default; }

        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        @media (max-width: 480px) { .options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="game-container">
    <!-- MÀN HÌNH CHÍNH -->
    <div id="home-screen">
        <h1>🏝️ ĐẢO TRI THỨC LỚP 2 🏝️</h1>
        <h2>Hôm nay con muốn làm gì nào?</h2>
        <button class="subject-btn btn-toan" onclick="startGame('Toan')">🧮 Thử thách Toán Học</button>
        <button class="subject-btn btn-tuduy" onclick="startGame('ToanTuDuy')">🧠 Toán Tư Duy (Nâng cao)</button>
        <button class="subject-btn btn-tv" onclick="startGame('TiengViet')">📖 Khám phá Tiếng Việt</button>
        <button class="subject-btn btn-dovui" onclick="startGame('DoVui')">🎯 Đố Vui Có Thưởng</button>
        <button class="subject-btn btn-game" onclick="startMiniGame()">🎮 Khu Vui Chơi (Giải trí)</button>
    </div>

    <!-- MÀN HÌNH HỌC TẬP (QUIZ) -->
    <div id="quiz-screen" style="display: none;">
        <div class="game-nav">
            <button class="back-btn" onclick="goHome()">🔙 Thoát</button>
            <span class="stars">⭐ x<span id="star-count">0</span></span>
        </div>
        <div style="font-weight:bold; color:#0984e3; margin-bottom: 10px;">Câu: <span id="q-counter">1/10</span></div>
        <div class="lesson-tag" id="lesson-name">Bài học</div>
        <div class="question" id="question-text">Câu hỏi ở đây</div>
        <div class="options" id="options-area"></div>
        <div class="feedback" id="feedback-area"></div>
        <button class="action-btn" id="next-btn" onclick="nextQuestion()">Tiếp tục nào! 🚀</button>
    </div>

    <!-- MÀN HÌNH HOÀN THÀNH -->
    <div id="result-screen" style="display: none;">
        <h1>🎉 TUYỆT VỜI! 🎉</h1>
        <h2>Con đã hoàn thành chuyến thám hiểm!</h2>
        <div class="stars" style="font-size: 50px; margin: 20px 0;">⭐ x<span id="final-stars">0</span></div>
        <button class="action-btn" style="display: inline-block; background: #00cec9; box-shadow: 0 5px 0 #00b894;" onclick="goHome()">🏠 Về trang chính</button>
    </div>

    <!-- MÀN HÌNH TRÒ CHƠI (MINI GAME) -->
    <div id="minigame-screen" style="display: none;">
        <div class="game-nav">
            <button class="back-btn" onclick="goHome()">🔙 Thoát</button>
            <h3 style="margin:0; color:#e17055;">Lật Hình Động Vật 🐯</h3>
        </div>
        <p style="color:#636e72; font-size: 16px; margin-top:0;">Tìm 2 hình giống nhau để ghi điểm nhé!</p>
        
        <div class="memory-board" id="memory-board"></div>
        
        <div id="game-win-msg" style="display: none; margin-top: 20px;">
            <h2 style="color: #00b894;">🎉 Khang, Dũng, Huy siêu quá! 🎉</h2>
            <button class="action-btn" style="display: inline-block; background:#fdcb6e; box-shadow: 0 5px 0 #e17055; color:#d63031" onclick="startMiniGame()">🔄 Chơi ván nữa</button>
        </div>
    </div>
</div>

<script src="questions.js"></script>
<script>
    /* =============================
       PHẦN 1: XỬ LÝ HỌC TẬP (QUIZ)
       ============================= */
    let currentSubject = [];
    let currentIndex = 0;
    let stars = 0;

    function goHome() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('minigame-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'block';
    }

    function startGame(subjectKey) {
        // Trộn câu hỏi và lấy 10 câu ngẫu nhiên từ file questions.js
        let shuffled = [...nganHangCauHoi[subjectKey]].sort(() => Math.random() - 0.5);
        currentSubject = shuffled.slice(0, 10); 
        currentIndex = 0;
        stars = 0;
        
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentSubject[currentIndex];
        document.getElementById('q-counter').innerText = `${currentIndex + 1}/${currentSubject.length}`;
        document.getElementById('star-count').innerText = stars;
        document.getElementById('lesson-name').innerText = q.baiHoc || "Ôn tập tổng hợp";
        document.getElementById('question-text').innerText = q.cauHoi;
        
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = ''; 
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        const shuffledOptions = [...q.dapAn].sort(() => Math.random() - 0.5);

        shuffledOptions.forEach(dapAn => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = dapAn;
            btn.onclick = () => checkAnswer(dapAn, q.dapAnDung, q.giaiThich, btn);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, explanation, btnElement) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true); 

        const feedback = document.getElementById('feedback-area');
        feedback.style.display = 'block';

        if (selected === correct) {
            btnElement.style.background = '#55efc4';
            btnElement.style.color = '#2d3436';
            btnElement.style.borderColor = '#00b894';
            feedback.className = 'feedback correct';
            feedback.innerHTML = `✨ <b>Chính xác!</b> Con được thưởng 1 ⭐ <br><small style="color:#2d3436; margin-top:5px; display:block">${explanation}</small>`;
            stars++;
            document.getElementById('star-count').innerText = stars;
        } else {
            btnElement.style.background = '#fab1a0';
            btnElement.style.borderColor = '#e17055';
            feedback.className = 'feedback wrong';
            feedback.innerHTML = `💦 <b>Chưa đúng rồi!</b> Đáp án là: <b>${correct}</b> <br><small style="color:#2d3436; margin-top:5px; display:block">${explanation}</small>`;
            
            buttons.forEach(b => {
                if(b.innerText === correct) {
                    b.style.background = '#55efc4';
                    b.style.borderColor = '#00b894';
                }
            });
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentSubject.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-stars').innerText = stars;
        }
    }

    /* =============================
       PHẦN 2: TRÒ CHƠI LẬT HÌNH
       ============================= */
    const emojiList = ['🐶','🐱','🐭','🦊','🐻','🐼','🐸','🐒'];
    let memoryCards = [];
    let flippedCards = [];
    let matchedCount = 0;

    function startMiniGame() {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('minigame-screen').style.display = 'block';
        document.getElementById('game-win-msg').style.display = 'none';
        
        const board = document.getElementById('memory-board');
        board.innerHTML = '';
        flippedCards = [];
        matchedCount = 0;

        // Tạo bộ bài x2 hình và xáo trộn
        memoryCards = [...emojiList, ...emojiList];
        memoryCards.sort(() => Math.random() - 0.5);

        // Render bài
        memoryCards.forEach((emoji, index) => {
            const card = document.createElement('div');
            card.className = 'memory-card';
            card.dataset.emoji = emoji;
            card.innerText = emoji;
            card.onclick = () => flipCard(card);
            board.appendChild(card);
        });
    }

    function flipCard(card) {
        // Chỉ cho lật nếu chưa lật, chưa được ghép và không quá 2 thẻ đang mở
        if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                setTimeout(checkMatch, 700);
            }
        }
    }

    function checkMatch() {
        const [card1, card2] = flippedCards;
        if (card1.dataset.emoji === card2.dataset.emoji) {
            card1.classList.replace('flipped', 'matched');
            card2.classList.replace('flipped', 'matched');
            matchedCount += 2;
            
            if (matchedCount === memoryCards.length) {
                document.getElementById('game-win-msg').style.display = 'block';
            }
        } else {
            card1.classList.remove('flipped');
            card2.classList.remove('flipped');
        }
        flippedCards = [];
    }
</script>

</body>
</html>
