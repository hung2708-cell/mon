<!-- Lưu file này với tên: index.html (để cùng thư mục với questions.js) -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vui Học Lớp 2</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f0f8ff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #ff69b4; }
        .question { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        button.option-btn { padding: 12px; font-size: 18px; border: 2px solid #87cefa; border-radius: 10px; background: white; cursor: pointer; transition: 0.3s; }
        button.option-btn:hover { background: #87cefa; color: white; }
        .feedback { margin-top: 20px; font-size: 18px; font-weight: bold; display: none; padding: 10px; border-radius: 10px; }
        .correct { background: #d4edda; color: #155724; }
        .wrong { background: #f8d7da; color: #721c24; }
        #next-btn { margin-top: 20px; padding: 10px 20px; font-size: 18px; background: #32cd32; color: white; border: none; border-radius: 10px; cursor: pointer; display: none; }
        #next-btn:hover { background: #228b22; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌟 Vui Học Lớp 2 🌟</h1>
    <div id="quiz-area">
        <div id="score-board">Câu hỏi: <span id="current-q">1</span> | Điểm: <span id="score">0</span></div>
        <div class="question" id="question-text">Đang tải câu hỏi...</div>
        <div class="options" id="options-area"></div>
        <div class="feedback" id="feedback-area"></div>
        <button id="next-btn" onclick="nextQuestion()">Câu tiếp theo ⏭️</button>
    </div>
    <div id="result-area" style="display: none;">
        <h2>🎉 Hoàn thành bài tập!</h2>
        <p style="font-size: 24px;">Điểm của con: <strong id="final-score"></strong></p>
        <button id="next-btn" style="display: inline-block;" onclick="location.reload()">🔄 Chơi lại</button>
    </div>
</div>

<!-- Nhúng file dữ liệu câu hỏi -->
<script src="questions.js"></script>

<script>
    let currentQuestionIndex = 0;
    let score = 0;
    // Trộn ngẫu nhiên ngân hàng câu hỏi
    let danhSachCauHoi = nganHangCauHoi.sort(() => Math.random() - 0.5);

    function loadQuestion() {
        const q = danhSachCauHoi[currentQuestionIndex];
        document.getElementById('current-q').innerText = currentQuestionIndex + 1;
        document.getElementById('question-text').innerText = q.cauHoi;
        
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = ''; // Xóa đáp án cũ
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        // Tạo nút cho từng đáp án
        q.dapAn.forEach(dapAn => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = dapAn;
            btn.onclick = () => checkAnswer(dapAn, q.dapAnDung, q.giaiThich, btn);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, explanation, btnElement) {
        // Khóa các nút sau khi đã chọn
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const feedback = document.getElementById('feedback-area');
        feedback.style.display = 'block';

        if (selected === correct) {
            btnElement.style.background = '#32cd32';
            btnElement.style.color = 'white';
            feedback.className = 'feedback correct';
            feedback.innerHTML = `✅ Chính xác! <br><small>${explanation}</small>`;
            score++;
            document.getElementById('score').innerText = score;
        } else {
            btnElement.style.background = '#ff4500';
            btnElement.style.color = 'white';
            feedback.className = 'feedback wrong';
            feedback.innerHTML = `❌ Sai rồi con ạ! Đáp án đúng là: <b>${correct}</b> <br><small>${explanation}</small>`;
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < danhSachCauHoi.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${danhSachCauHoi.length}`;
        }
    }

    // Khởi động ứng dụng
    window.onload = loadQuestion;
</script>

</body>
</html>
